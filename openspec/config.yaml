schema: spec-driven

context: |
  Halo CMS plugin providing shared AI capabilities to other plugins.
  Modules: api (public Java SDK), app (plugin implementation), and ui (Vue Console UI
  plus the public npm SDK). The project has been released since v1.0.0.

  AiProvider and AiModel are Halo Extensions. AiModel.spec.providerName references
  AiProvider.metadata.name, while AiModelService resolves models by AiModel.metadata.name.
  Consumer plugins obtain AiModelService through Halo's ExtensionGetter.

rules:
  proposal:
    - Include a non-goals section when reducing scope.
    - State whether a change affects the backend, Console UI, Java SDK, npm SDK, persisted Extension data, or generated API contracts.
    - Identify compatibility impact for every affected released surface.
  design:
    - Preserve the distinction between provider type, provider resource name, model resource name, and provider-side model ID.
    - Keep public SDK APIs provider-neutral and free of Spring AI types.
    - Store provider credentials as Halo Secret references; never add plaintext credential fields to Extensions.
    - Resolve cross-plugin services through ExtensionGetter; do not add static service locators or cross-plugin injection assumptions.
    - Treat server-side validation as authoritative and provider metadata from the backend as the source of truth.
    - Treat super administrator usage and configuration as the permission boundary; do not add role-specific permission configuration for other users.
    - Preserve public Java/npm APIs, persisted Extension data, and externally documented contracts by default.
    - For a breaking change, specify affected versions, migration or upgrade handling, and release impact.
  tasks:
    - Put server-side validation before UI validation tasks when both are required.
    - After backend API changes, regenerate the TypeScript client instead of editing generated files manually.
    - When UI work is split into another change, remove its tasks instead of leaving placeholders.
